<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mapa de Proyectos</title>
    <meta name="description" content="Mapa interactivo de proyectos de arquitectura en el Perú: Artefacto y Unidad.">
    <meta name="theme-color" content="#F0EEF1">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23F0EEF1'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body>
    <div id="map" aria-label="Mapa del Perú con los proyectos"></div>

    <aside class="card filters" id="filters" aria-label="Filtros">
      <header class="brand">
        <div>
          <p class="eyebrow" id="app-subtitle"></p>
          <h1 id="app-title"></h1>
          <p class="count" id="result-count" aria-live="polite"></p>
        </div>
        <button type="button" class="btn btn--ghost btn--sm filters-toggle" id="filters-toggle" aria-expanded="false" aria-controls="filters-body"></button>
      </header>
      <div class="filters-body" id="filters-body">
        <div class="segmented" id="type-filter" role="radiogroup" aria-label="Tipo de proyecto"></div>
        <label class="field">
          <span>Buscar</span>
          <input type="search" id="search" placeholder="Título, estudiante, ciudad…" autocomplete="off">
        </label>
        <label class="field">
          <span>Departamento</span>
          <select id="dept-filter"></select>
        </label>
        <div class="field">
          <span>Etiquetas</span>
          <div class="tag-cloud" id="tag-cloud"></div>
        </div>
        <button type="button" class="link-btn" id="clear-filters" hidden>Limpiar filtros</button>
      </div>
    </aside>

    <button type="button" class="btn btn--dark btn--lg upload-btn" id="open-upload"></button>

    <div class="map-controls" role="group" aria-label="Zoom">
      <button type="button" class="ctrl" id="zoom-in" aria-label="Acercar"></button>
      <button type="button" class="ctrl" id="zoom-out" aria-label="Alejar"></button>
      <button type="button" class="ctrl" id="zoom-home" aria-label="Ver todo el mapa"></button>
    </div>

    <div class="mode-badge" id="mode-badge" hidden></div>

    <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Panel del proyecto">
      <div class="drawer__content" id="drawer-content"></div>
    </aside>

    <div class="placing-bar" id="placing-bar">
      <p></p>
      <button type="button" class="btn btn--dark btn--sm" id="placing-done">Listo</button>
    </div>

    <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Imagen ampliada"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
